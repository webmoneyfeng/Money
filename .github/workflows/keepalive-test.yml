name: Keepalive 3x30s Test

on:
  push:
    paths:
      - "scripts/keepalive.sh"
      - ".github/workflows/keepalive-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run the real keepalive script 3 times, 30s apart
        shell: bash
        run: |
          set -o pipefail
          rm -f /tmp/keepalive.log
          set +e
          timeout 75s env KEEPALIVE_MIN_INTERVAL=30 KEEPALIVE_MAX_INTERVAL=30 KEEPALIVE_LOG=/tmp/keepalive.log bash scripts/keepalive.sh
          rc=$?
          set -e
          cat /tmp/keepalive.log || true
          success_count=$(grep -c "保活成功: HTTP 200" /tmp/keepalive.log || true)
          echo "SUCCESS_COUNT=$success_count"
          echo "TIMEOUT_RC=$rc"
          test "$success_count" -eq 3
